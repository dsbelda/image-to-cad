<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>ImageToCad</title>
<style>
  :root { --bg:#f3f5f8; --card:#fff; --ink:#1c2430; --mute:#5d6b7c; --line:#d9dee5; --acc:#1f6feb; --acc2:#1558c0; --soft:#eaf1fe; --warn:#b54708; --warnbg:#fff4e5; --err:#b42318; --ok:#067647; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#10151c; --card:#18202a; --ink:#e6ebf2; --mute:#97a4b5; --line:#2b3745; --acc:#4c8dff; --acc2:#6fa3ff; --soft:#1d2a3d; --warn:#f5b45a; --warnbg:#2b2112; --err:#ff8b80; --ok:#4ade80; }
    img.view { background:#fff; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--ink); }
  header { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; padding:12px 24px; background:var(--card); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
  .brand { display:flex; align-items:center; gap:10px; } .brand svg { width:28px; height:28px; color:var(--acc); }
  h1 { font-size:18px; margin:0; letter-spacing:.2px; } .tag { color:var(--mute); font-size:13px; }
  nav button { padding:5px 12px; border-radius:20px; font-size:13px; color:var(--mute); }
  nav a { color:var(--mute); font-size:13px; text-decoration:none; border:1px solid var(--line); padding:5px 10px; border-radius:20px; }
  nav a:hover { color:var(--acc); border-color:var(--acc); }
  main { max-width:1100px; margin:20px auto 60px; padding:0 16px; display:grid; gap:16px; }
  ol.steps { list-style:none; display:flex; gap:8px; margin:0; padding:0; flex-wrap:wrap; }
  ol.steps li { display:flex; align-items:center; gap:8px; padding:6px 12px; border-radius:20px; background:var(--card); border:1px solid var(--line); color:var(--mute); font-size:13px; }
  ol.steps li b { display:grid; place-items:center; width:20px; height:20px; border-radius:50%; background:var(--line); color:var(--card); font-size:12px; }
  ol.steps li.on { color:var(--ink); border-color:var(--acc); background:var(--soft); } ol.steps li.on b { background:var(--acc); }
  ol.steps li.done b { background:var(--ok); }
  section { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; box-shadow:0 1px 2px rgba(0,0,0,.04); }
  h2 { font-size:16px; margin:0 0 12px; }
  button { font:inherit; padding:9px 16px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; transition:background .15s,border-color .15s; }
  button:hover:not(:disabled) { border-color:var(--acc); }
  button.primary { background:var(--acc); border-color:var(--acc); color:#fff; font-weight:600; } button.primary:hover:not(:disabled) { background:var(--acc2); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .drop:focus-within { outline:2px solid var(--acc); outline-offset:2px; }
  input, select, textarea { font:inherit; width:100%; padding:9px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--ink); }
  label { display:block; margin:12px 0 4px; color:var(--mute); font-size:13px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; } .row > * { flex:0 0 auto; width:auto; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; } @media (max-width:800px){ .grid2{grid-template-columns:1fr;} header{padding:10px 14px;} }
  #btnMic { display:inline-flex; align-items:center; gap:8px; } #micDot { width:10px; height:10px; border-radius:50%; background:var(--mute); }
  #btnMic.rec { border-color:var(--err); color:var(--err); } #btnMic.rec #micDot { background:var(--err); animation:pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity:.25; } } @media (prefers-reduced-motion: reduce){ #btnMic.rec #micDot{animation:none;} }
  fieldset.modes { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; border:0; padding:0; margin:14px 0 0; } @media (max-width:760px){ fieldset.modes{grid-template-columns:1fr;} }
  .mode { display:flex; align-items:flex-start; gap:10px; margin:0; padding:10px 12px; border:1px solid var(--line); border-radius:10px; cursor:pointer; color:var(--ink); }
  .mode input { width:auto; margin-top:4px; } .mode small { display:block; color:var(--mute); font-size:12px; } .mode:has(input:checked) { border-color:var(--acc); background:var(--soft); }
  #uso div { margin:2px 0; } #uso .agotado { color:var(--warn); }
  .drop { position:relative; display:flex; align-items:center; gap:16px; padding:22px; margin:0; border:2px dashed var(--line); border-radius:12px; background:var(--bg); color:var(--ink); cursor:pointer; transition:border-color .15s,background .15s; }
  .drop:hover, .drop.over { border-color:var(--acc); background:var(--soft); }
  .drop input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; padding:0; }
  .drop svg { width:40px; height:40px; color:var(--acc); flex:none; } .drop strong { display:block; font-size:15px; }
  .drop img { width:84px; height:64px; object-fit:cover; border-radius:6px; border:1px solid var(--line); background:#fff; }
  .figure { margin:0; } .figure figcaption { color:var(--mute); font-size:13px; margin-bottom:6px; }
  /* marco de tamaño fijo: cada vista tiene otras proporciones y, sin él, la página saltaba al cambiar el selector */
  .stage { position:relative; height:min(68vh, 560px); border:1px solid var(--line); border-radius:8px; background:#fff; overflow:hidden; }
  .stage img.view { display:block; width:100%; height:100%; object-fit:contain; border:0; border-radius:0; background:#fff; cursor:zoom-in; transition:opacity .15s; }
  .stage.cargando img.view { opacity:.25; cursor:progress; }
  .stage.cargando::after { content:""; position:absolute; left:50%; top:50%; width:34px; height:34px; margin:-17px 0 0 -17px; border:3px solid #cfd6df; border-top-color:var(--acc); border-radius:50%; animation:spin .8s linear infinite; }
  #status { color:var(--mute); display:inline-flex; align-items:center; gap:8px; } #status.error { color:var(--err); }
  #status.busy::before { content:""; width:14px; height:14px; border:2px solid var(--line); border-top-color:var(--acc); border-radius:50%; animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } } @media (prefers-reduced-motion: reduce){ #status.busy::before{animation-duration:3s;} }
  .q { margin-bottom:10px; } .hint { color:var(--mute); font-size:13px; margin:8px 0; }
  .assume-box { margin-top:14px; padding:10px 14px; border-radius:8px; background:var(--warnbg); color:var(--warn); }
  .assume-box p { margin:0 0 4px; font-weight:600; font-size:13px; } ul.assume { margin:0; padding-left:20px; }
  dialog { border:1px solid var(--line); border-radius:12px; width:min(480px,94vw); background:var(--card); color:var(--ink); }
  dialog.loading { width:min(340px,92vw); text-align:center; padding:28px 22px; }
  dialog.loading[open] { display:flex; flex-direction:column; align-items:center; gap:8px; }
  dialog.loading::backdrop { background:rgba(10,15,22,.72); backdrop-filter:blur(2px); }
  .spinner { width:44px; height:44px; border:4px solid var(--line); border-top-color:var(--acc); border-radius:50%; animation:spin .9s linear infinite; margin-bottom:6px; }
  @media (prefers-reduced-motion: reduce){ .spinner{animation-duration:3s;} }
  dialog.zoom { width:min(1200px,96vw); padding:8px; } dialog.zoom img { width:100%; background:#fff; border-radius:6px; } dialog::backdrop { background:rgba(0,0,0,.6); }
  .hidden { display:none !important; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l9 4 9-4M3 12l9 4 9-4M12 3l9 4.5-9 4.5L3 7.5z"/></svg>
    <div><h1>ImageToCad</h1><div class="tag">De la foto o croquis al plano DXF/DWG</div></div>
  </div>
  <nav><button id="btnLogout" type="button">Salir</button></nav>
</header>
<main>
  <ol class="steps" aria-label="Pasos">
    <li id="st1" class="on"><b>1</b> Imagen</li><li id="st2"><b>2</b> Dudas</li><li id="st3"><b>3</b> Resultado</li>
  </ol>

  <section id="secUpload">
    <h2>Sube una imagen</h2>
    <label class="drop" id="drop" for="file">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4m0 0l-4 4m4-4l4 4M4 16v3a1 1 0 001 1h14a1 1 0 001-1v-3"/></svg>
      <span id="dropText"><strong>Arrastra una imagen aquí o pulsa para elegirla</strong><span class="hint">Foto, croquis, plano ortogonal o isométrico · PNG, JPG o WEBP · máx. 25 MB</span></span>
      <img id="thumb" class="hidden" alt="Miniatura de la imagen elegida">
      <input id="file" type="file" accept="image/*">
    </label>
    <label for="notes">Notas para la IA (opcional: escala, qué significa cada color, diámetros…). Escríbelas o dictalas con el micrófono.</label>
    <textarea id="notes" rows="3"></textarea>
    <div class="row" style="margin-top:8px">
      <button id="btnMic" type="button" class="hidden" aria-pressed="false"><span id="micDot"></span><span id="micText">Dictar con el micrófono</span></button>
      <span class="hint" id="micHint"></span>
    </div>
    <fieldset class="modes" aria-label="Modo de análisis">
      <label class="mode"><input type="radio" name="mode" value="normal" checked><span><strong>Normal</strong><small>Rápido. Para la mayoría de imágenes.</small></span></label>
      <label class="mode"><input type="radio" name="mode" value="exhaustivo"><span><strong>Exhaustivo</strong><small>Más lento y detallado. Para planos complejos o dudosos.</small></span></label>
      <label class="mode"><input type="radio" name="mode" value="ultra"><span><strong>Ultra</strong><small>Máxima calidad, con límite diario.</small></span></label>
    </fieldset>
    <div id="uso" class="hint" aria-live="polite"></div>
    <div class="hint">Cada imagen que subes cuenta como un análisis; las preguntas de seguimiento no gastan más.</div>
    <div class="row" style="margin-top:14px">
      <button id="btnAnalyze" class="primary" type="button">Analizar y generar CAD</button>
      <button id="btnReset" type="button" class="hidden">Nueva imagen</button>
      <span id="status" role="status" aria-live="polite"></span>
    </div>
  </section>

  <section id="secQ" class="hidden">
    <h2>La IA tiene dudas</h2>
    <div id="qs"></div>
    <div class="row">
      <button id="btnAnswer" class="primary" type="button">Enviar respuestas</button>
      <button id="btnForce" type="button">Generar igualmente (con supuestos)</button>
    </div>
  </section>

  <section id="secR" class="hidden">
    <h2>Resultado</h2>
    <div class="row">
      <label for="view" style="margin:0">Vista</label>
      <select id="view"><option value="iso">Isométrica</option><option value="alzado">Ortogonal: alzado</option><option value="planta">Ortogonal: planta</option></select>
      <a id="dlDxf"><button type="button" class="primary">Descargar DXF</button></a>
      <a id="dlDwg"><button id="btnDwg" type="button">Descargar DWG</button></a>
    </div>
    <p class="hint" id="dwgHint"></p>
    <div class="grid2">
      <figure class="figure"><figcaption>Original</figcaption><div class="stage"><img id="imgOrig" class="view" alt="Imagen original subida"></div></figure>
      <figure class="figure"><figcaption>Vista previa del CAD</figcaption><div class="stage" id="stagePrev"><img id="imgPrev" class="view" alt="Vista previa del plano generado"></div></figure>
    </div>
    <div id="assume"></div>
  </section>
</main>

<dialog id="loading" class="loading" role="alertdialog" aria-labelledby="loadTitle" aria-describedby="loadSub">
  <div class="spinner" aria-hidden="true"></div>
  <strong id="loadTitle">La IA está trabajando…</strong>
  <span id="loadSub" class="hint"></span>
  <span id="loadTime" class="hint"></span>
</dialog>

<dialog id="zoom" class="zoom"><img id="zoomImg" alt="Imagen ampliada"></dialog>

<script>
const $ = id => document.getElementById(id);
let sid = null, dwgOk = false, timer = null;
const status = (t, kind) => { $('status').textContent = t; $('status').className = kind || ''; };
const post = async (url, opts) => {
  const r = await fetch(url, opts); const j = await r.json().catch(() => ({}));
  if (r.status === 401) { location.href = '/login'; throw new Error('Sesión caducada'); }
  if (!r.ok) throw new Error(j.error || 'Error ' + r.status); return j;
};
const busy = on => [...document.querySelectorAll('main button, input[name=mode]')].forEach(b => { b.disabled = on; });
const steps = n => ['st1', 'st2', 'st3'].forEach((id, i) => { $(id).className = i + 1 === n ? 'on' : i + 1 < n ? 'done' : ''; });

// --- elegir imagen: clic, arrastrar y soltar, miniatura ---
function pick(f) {
  if (!f) return;
  if (!f.type.startsWith('image/')) return status('Eso no es una imagen.', 'error');
  if (f.size > 25 * 1024 * 1024) return status('La imagen pesa más de 25 MB.', 'error');
  const dt = new DataTransfer(); dt.items.add(f); $('file').files = dt.files;
  $('thumb').src = URL.createObjectURL(f); $('thumb').classList.remove('hidden');
  $('dropText').innerHTML = ''; const s = document.createElement('strong'); s.textContent = f.name;
  const h = document.createElement('span'); h.className = 'hint'; h.textContent = (f.size / 1048576).toFixed(1) + ' MB · pulsa para cambiarla';
  $('dropText').append(s, h); status('');
}
$('file').onchange = () => pick($('file').files[0]);
['dragenter', 'dragover'].forEach(e => $('drop').addEventListener(e, ev => { ev.preventDefault(); $('drop').classList.add('over'); }));
['dragleave', 'drop'].forEach(e => $('drop').addEventListener(e, ev => { ev.preventDefault(); $('drop').classList.remove('over'); }));
$('drop').addEventListener('drop', ev => pick(ev.dataTransfer.files[0]));
document.addEventListener('paste', ev => { const f = [...(ev.clipboardData?.files || [])].find(x => x.type.startsWith('image/')); if (f) pick(f); });

function show(res) {
  $('secQ').classList.toggle('hidden', res.status !== 'questions');
  $('secR').classList.toggle('hidden', res.status !== 'drawing');
  $('btnReset').classList.remove('hidden');
  if (res.status === 'questions') {
    steps(2); $('qs').innerHTML = '';
    res.questions.forEach((q, i) => {
      const d = document.createElement('div'); d.className = 'q';
      const l = document.createElement('label'); l.textContent = q; l.htmlFor = 'q' + i;
      const inp = document.createElement('input'); inp.id = 'q' + i;
      d.append(l, inp); $('qs').append(d);
    });
    status('Responde las dudas de la IA.');
    $('secQ').scrollIntoView({ behavior: 'smooth', block: 'start' });
  } else {
    steps(3); dwgOk = res.dwg; $('view').value = res.view;
    verPrevia(res.png);
    setLinks();
    $('assume').innerHTML = '';
    if (res.assumptions.length) {
      const box = document.createElement('div'); box.className = 'assume-box';
      const p = document.createElement('p'); p.textContent = 'La IA ha supuesto (marcado [CONFIRMAR] en el plano):';
      const ul = document.createElement('ul'); ul.className = 'assume';
      res.assumptions.forEach(a => { const li = document.createElement('li'); li.textContent = a; ul.append(li); });
      box.append(p, ul); $('assume').append(box);
    }
    status('Listo.');
    $('secR').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}
function setLinks() {
  const v = $('view').value;
  $('dlDxf').href = `/api/download/${sid}.dxf?view=${v}`;
  $('dlDwg').href = dwgOk ? `/api/download/${sid}.dwg?view=${v}` : '#';
  $('btnDwg').disabled = !dwgOk;
  $('dwgHint').textContent = dwgOk ? '' : 'DWG no disponible en este servidor. El DXF se abre igual en ZWCAD (guárdalo como DWG desde ahí).';
}
// La vista previa se vuelve a dibujar en el servidor: se atenúa con un spinner hasta que llega la imagen nueva
const verPrevia = url => { $('stagePrev').classList.add('cargando'); $('imgPrev').src = url; };
$('imgPrev').addEventListener('load', () => $('stagePrev').classList.remove('cargando'));
$('imgPrev').addEventListener('error', () => { $('stagePrev').classList.remove('cargando'); status('No se pudo dibujar esa vista. Prueba de nuevo.', 'error'); });
$('view').onchange = () => { setLinks(); verPrevia(`/api/preview/${sid}.png?view=${$('view').value}&v=${Date.now()}`); };

// Los análisis se hacen en segundo plano (los proxies cortan las peticiones largas): se pregunta cada 2 s por el trabajo
async function pollJob(id) {
  let caidas = 0;
  for (;;) {
    await new Promise(r => setTimeout(r, 2000));
    let j;
    try { j = await post('/api/job/' + id); caidas = 0; }
    catch (e) { if (e.message === 'Sesión caducada' || ++caidas > 5 || !/Failed to fetch|NetworkError|Load failed/i.test(e.message)) throw e; continue; }
    if (j.state === 'done') { if (j.code >= 400) throw new Error(j.body.error || 'Error ' + j.code); return j.body; }
  }
}

// Modal de carga: bloquea toda la página mientras la IA trabaja (Escape no lo cierra)
$('loading').addEventListener('cancel', e => e.preventDefault());
async function run(fn, titulo, detalle) {
  busy(true); const t0 = Date.now();
  $('loadTitle').textContent = titulo || 'La IA está trabajando…';
  $('loadSub').textContent = detalle || 'No cierres ni recargues la página.';
  const tick = () => {
    const s = Math.floor((Date.now() - t0) / 1000);
    $('loadTime').textContent = `${s} s · puede tardar hasta un par de minutos`;
    status(`La IA está trabajando… ${s} s`, 'busy');
  };
  tick(); timer = setInterval(tick, 1000);
  $('loading').showModal();
  try { show(await fn()); } catch (e) { status(e.message, 'error'); } finally {
    clearInterval(timer); $('loading').close(); busy(false); loadUso(); if (!$('secR').classList.contains('hidden')) setLinks();
  }
}
$('btnAnalyze').onclick = () => {
  const f = $('file').files[0]; if (!f) return status('Elige una imagen primero.', 'error');
  const fd = new FormData(); fd.append('image', f); fd.append('notes', $('notes').value); fd.append('mode', document.querySelector('input[name=mode]:checked').value);
  $('imgOrig').src = URL.createObjectURL(f);
  steps(1);
  run(async () => { const r = await post('/api/analyze', { method: 'POST', body: fd }); sid = r.sid; return pollJob(r.job); },
    'Analizando la imagen…', 'La IA está leyendo tu croquis o plano y preparando el dibujo.');
};
const answer = force => run(async () => pollJob((await post('/api/answer', { method: 'POST', headers: { 'Content-Type': 'application/json' },
  body: JSON.stringify({ sid, force, answers: [...$('qs').querySelectorAll('input')].map(i => i.value) }) })).job),
  force ? 'Generando el dibujo con supuestos…' : 'Procesando tus respuestas…',
  force ? 'La IA completará lo que falta con suposiciones razonables.' : 'La IA está revisando lo que le has contestado y puede volver a preguntar o generar el dibujo.');
$('btnAnswer').onclick = () => answer(false);
$('btnForce').onclick = () => answer(true);
$('btnReset').onclick = () => { location.reload(); };
$('btnLogout').onclick = async () => { await fetch('/api/logout', { method: 'POST' }); location.href = '/login'; };

// --- dictado por voz (reconocimiento del navegador; en Firefox no existe y el botón no se muestra) ---
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
if (SR) $('btnMic').classList.remove('hidden');
function micUi(on) {
  $('btnMic').classList.toggle('rec', on); $('btnMic').setAttribute('aria-pressed', on);
  $('micText').textContent = on ? 'Parar de dictar' : 'Dictar con el micrófono';
  $('micHint').textContent = on ? 'Escuchando… habla con normalidad.' : '';
}
$('btnMic').onclick = () => {
  if (rec) { rec.stop(); return; }
  rec = new SR(); rec.lang = 'es-ES'; rec.continuous = true; rec.interimResults = true;
  const base = $('notes').value.trim() ? $('notes').value.trim() + ' ' : '';
  rec.onresult = e => {
    let fin = '', tmp = '';
    for (const r of e.results) (r.isFinal ? (fin += r[0].transcript + ' ') : (tmp += r[0].transcript));
    $('notes').value = (base + fin + tmp).replace(/\s+/g, ' ').trimStart();
  };
  rec.onerror = e => { if (e.error === 'not-allowed' || e.error === 'service-not-allowed') status('El navegador no tiene permiso para usar el micrófono.', 'error'); else if (e.error !== 'no-speech' && e.error !== 'aborted') status('Error del dictado: ' + e.error, 'error'); };
  rec.onend = () => { rec = null; micUi(false); $('notes').value = $('notes').value.trim(); };
  try { rec.start(); micUi(true); } catch (e) { rec = null; micUi(false); }
};

// --- cupo de uso de la IA (límites en el servidor; aquí solo se muestran) ---
const NOMBRE = { normal: 'Normal', exhaustivo: 'Exhaustivo', ultra: 'Ultra' };
async function loadUso() {
  let u; try { u = await (await fetch('/api/uso')).json(); } catch (e) { return; }
  const html = [];
  for (const m of ['normal', 'exhaustivo', 'ultra']) {
    const ventanas = Object.entries(u[m]).sort((x, y) => parseInt(x[0]) - parseInt(y[0]));
    const agotada = ventanas.find(([, v]) => v.usado >= v.limite);
    const radio = document.querySelector(`input[name=mode][value=${m}]`);
    radio.dataset.agotado = agotada ? '1' : '';
    const d = document.createElement('div'); if (agotada) d.className = 'agotado';
    d.textContent = `${NOMBRE[m]}: ` + ventanas.map(([n, v]) => `${Math.max(v.limite - v.usado, 0)} de ${v.limite} libres en ${n}`).join(' · ')
      + (agotada && agotada[1].libera ? ` — vuelve a las ${new Date(agotada[1].libera * 1000).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' })}` : '');
    html.push(d);
  }
  $('uso').replaceChildren(...html);
  const marcado = document.querySelector('input[name=mode]:checked');
  if (marcado && marcado.dataset.agotado) { const otro = document.querySelector('input[name=mode]:not([data-agotado="1"])'); if (otro) otro.checked = true; }
  document.querySelectorAll('input[name=mode]').forEach(r => { r.disabled = !!r.dataset.agotado; r.closest('label').style.opacity = r.dataset.agotado ? .55 : ''; });
  $('btnAnalyze').disabled = !!document.querySelector('input[name=mode]:checked')?.dataset.agotado;
}
loadUso();

// el modo elegido se recuerda en este navegador
const savedMode = localStorage.getItem('modo'); if (savedMode) { const r = document.querySelector(`input[name=mode][value=${savedMode}]`); if (r) r.checked = true; }
document.querySelectorAll('input[name=mode]').forEach(r => r.onchange = () => localStorage.setItem('modo', r.value));

// --- ampliar imágenes ---
['imgOrig', 'imgPrev'].forEach(id => $(id).addEventListener('click', () => { $('zoomImg').src = $(id).src; $('zoom').showModal(); }));
$('zoom').addEventListener('click', () => $('zoom').close());
</script>
</body>
</html>
